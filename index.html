    <script>      const QUESTIONS = [        { q: "Фундаменталда ең маңыздысы не іздеу?", a: ["Қысқа мерзімді баға қозғалысын талдау", "Ішкі құн мен ұзақ мерзімді өсімді бағалау", "Сауда сигналдары мен кіру нүктесін табу", "Нарық көлемі мен белсенділікті бақылау"], correct: 1 },        { q: "Free Cash Flow деген не?", a: ["Компанияның жалпы табыс көрсеткіші", "Шығыннан кейінгі еркін ақша көлемі", "Қарыз міндеттемелерінің жалпы сомасы", "Дивидендке бөлінетін ақша ағыны"], correct: 1 },        { q: "Company analysis кезінде не қаралады?", a: ["Қысқа мерзімді баға өзгерістері мен нарық динамикасын талдау", "Қаржылық есептер мен компанияның өсу мүмкіндігін бағалау", "Нарық жаңалықтары мен инвестор көңіл-күйін бақылау", "Сауда көлемі мен акция белсенділігін салыстыру"], correct: 1 },        { q: "Market capitalization қалай есептеледі?", a: ["Кіріс пен пайда көрсеткішін көбейту", "Акция бағасы мен санын көбейту", "Қарыз бен активтерді қосу", "EPS пен табысты есептеу"], correct: 1 },        { q: "EBITDA нені білдіреді?", a: ["Компанияның негізгі операциялық нәтижесін сипаттайды", "Салық пен пайызға дейінгі табыс деңгейін сипаттайды", "Барлық шығыннан кейінгі таза пайда құрылымын сипаттайды", "Активтердің жалпы нарықтық құнын сипаттайды"], correct: 1 },        { q: "Insider activity нені көрсетеді?", a: ["Компания ішкі басқару мен сенім деңгейін сипаттайды", "Баға қозғалысының қысқа мерзімді бағытын сипаттайды", "Нарық жаңалықтарының бағаға әсерін сипаттайды", "Сауда белсенділігі мен көлем динамикасын сипаттайды"], correct: 0 },        { q: "ROE нені көрсетеді?", a: ["Баға қозғалысын көрсетеді", "Капитал тиімділігін көрсетеді", "Қарыз деңгейін көрсетеді", "Нарық белсенділігін көрсетеді"], correct: 1 },        { q: "Overvalued акция деген не?", a: ["Нарықта төмен бағаланған акция", "Нарық бағасы ішкі құнынан жоғары акция", "Қаржылық көрсеткіші әлсіз компания акциясы", "Дивиденд төлемейтін тұрақсыз акция"], correct: 1 },        { q: "Undervalued акция деген не?", a: ["Жоғары ,        { q: "Cash Flow Statement не үшін керек?", a: ["Компанияның жалпы табысын бағалау үшін", "Нақты ақша қозғалысын бақылау үшін", "Қаржылық есептерді салыстыру үшін", "Инвестициялық шешім қабылдау үшін"], correct: 1 },        { q: "Revenue деген не?", a: ["Таза пайданы білдіреді", "Жалпы кірісті білдіреді", "Қарыз сомасын білдіреді", "Активтер жиынын білдіреді"], correct: 1 },        { q: "Risk-on нені білдіреді?", a: ["Инвесторлар қауіптен қашып, қорғаныс активтерін таңдайды", "Инвесторлар тәуекелден бас тартады", "Инвесторлар жоғары табыс үшін тәуекелге барады", "Нарық толық тұрақсыз күйге өтеді"], correct: 2 },        { q: "Risk-off нені білдіреді?", a: ["Инвесторлар тәуекелді активтерге көбірек ақша салады", "Инвесторлар қорғаныс активтеріне асығады", "Нарықтағы баға тұрақты өседі", "Сауда көлемі күрт артады"], correct: 1 },        { q: "YoY деген не?", a: ["Айлық өзгеріс қарқынын көрсетеді", "Апталық өзгеріс қарқынын көрсетеді", "Жылдық өзгеріс қарқынын көрсетеді", "Күнделікті өзгеріс қарқынын көрсетеді"], correct: 2 },        { q: "P/E көрсеткіші нені білдіреді?", a: ["Қарыз бен капитал арақатынасын сипаттайды", "Баға мен пайда қатынасын сипаттайды", "Дивиденд пен табыс деңгейін сипаттайды", "Активтер тиімділігі мен құнын сипаттайды"], correct: 1 },        { q: "10-K және 10-Q деген не?", a: ["Компания акцияларының нарықтағы бағасын көрсететін есеп", "Жылдық және тоқсандық қаржылық есептер", "Тек салық төлеуге арналған есеп түрі", "Инвестициялық портфельді басқару құжаты"], correct: 1 }      ];

      const byId = (id) => document.getElementById(id);      const letters = ["A", "B", "C", "D"];      const state = { order: [], correctSlots: [], current: 0, score: 0, selected: null, locked: false, timerId: null, timeLeft: 30, history: [] };

      function playSound(type) {        try {          const AudioContext = window.AudioContext || window.webkitAudioContext;          if (!AudioContext) return;          const ctx = new AudioContext();          const osc = ctx.createOscillator();          const gain = ctx.createGain();          const settings = { click: [620, 0.05, 0.08], correct: [880, 0.09, 0.18], wrong: [190, 0.08, 0.2] }[type];          if (!settings) return;          osc.connect(gain);          gain.connect(ctx.destination);          osc.frequency.value = settings[0];          gain.gain.setValueAtTime(settings[1], ctx.currentTime);          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + settings[2]);          osc.start();          osc.stop(ctx.currentTime + settings[2]);        } catch (error) {          return;        }      }

      function shuffle(items) {        const copy = [...items];        for (let i = copy.length - 1; i > 0; i -= 1) {          const j = Math.floor(Math.random() * (i + 1));          [copy[i], copy[j]] = [copy[j], copy[i]];        }        return copy;      }

      function buildCorrectSlots(total) {        const slots = [];        let previous = -1;

        while (slots.length < total) {          const group = shuffle([0, 1, 2, 3]);          if (group[0] === previous) {            [group[0], group[1]] = [group[1], group[0]];          }

          group.forEach((slot) => {            if (slots.length < total) {              slots.push(slot);              previous = slot;            }          });        }

        return slots;      }

      function buildAnswerOrder(question, correctVisibleIndex) {        const correctOption = { text: question.a[question.correct], index: question.correct };        const wrongOptions = shuffle(question.a          .map((text, index) => ({ text, index }))          .filter((option) => option.index !== question.correct));

        const answerOrder = [];        for (let index = 0; index < question.a.length; index += 1) {          answerOrder[index] = index === correctVisibleIndex ? correctOption : wrongOptions.shift();        }

        return answerOrder;      }

      function showScreen(id) {        document.querySelectorAll(".screen").forEach((screen) => screen.classList.remove("active"));        byId(id).classList.add("active");        document.body.classList.toggle("home-active", id === "introScreen");      }

      function updateMetrics() {        const answered = state.history.length;        const accuracy = answered ? Math.round((state.score / answered) * 100) : 0;        byId("questionMetric").textContent = `${Math.min(state.current + 1, QUESTIONS.length)}/${QUESTIONS.length}`;        byId("scoreMetric").textContent = state.score;        byId("accuracyMetric").textContent = `${accuracy}%`;      }

      function startGame() {        clearInterval(state.timerId);        state.order = shuffle(QUESTIONS.map((_, index) => index));        state.correctSlots = buildCorrectSlots(QUESTIONS.length);        state.current = 0;        state.score = 0;        state.selected = null;        state.locked = false;        state.history = [];        state.timeLeft = 30;        showScreen("quizScreen");        renderQuestion();      }

      function renderQuestion() {        const question = QUESTIONS[state.order[state.current]];        state.locked = false;        state.selected = null;        state.timeLeft = 30;        byId("statusText").textContent = "";        byId("counter").textContent = `${state.current + 1} / ${QUESTIONS.length}`;        byId("timer").textContent = "30s";        byId("progressBar").style.width = `${(state.current / QUESTIONS.length) * 100}%`;        byId("questionText").textContent = question.q;        const answerOrder = buildAnswerOrder(question, state.correctSlots[state.current]);        const answers = byId("answers");        answers.innerHTML = "";

        answerOrder.forEach((option, visibleIndex) => {          const button = document.createElement("button");          button.className = "answer";          button.type = "button";          button.dataset.originalIndex = option.index;          button.innerHTML = `<span class="letter">${letters[visibleIndex]}</span><span>${option.text}</span>`;          button.addEventListener("click", () => chooseAnswer(button, option.index));          answers.appendChild(button);        });

        updateMetrics();        startTimer();      }

      function returnHome() {        clearInterval(state.timerId);        state.correctSlots = [];        state.current = 0;        state.score = 0;        state.selected = null;        state.locked = false;        state.timeLeft = 30;        state.history = [];        updateMetrics();        showScreen("introScreen");      }

      function startTimer() {        clearInterval(state.timerId);        state.timerId = setInterval(() => {          state.timeLeft -= 1;          byId("timer").textContent = `${state.timeLeft}s`;          if (state.timeLeft <= 0) chooseAnswer(null, -1);        }, 1000);      }

      function chooseAnswer(button, selectedIndex) {        if (state.locked) return;        state.locked = true;        clearInterval(state.timerId);        const question = QUESTIONS[state.order[state.current]];        const isCorrect = selectedIndex === question.correct;        if (isCorrect) {          state.score += 1;          playSound("correct");        } else {          playSound("wrong");        }        state.history.push({ question: question.q, correctAnswer: question.a[question.correct], isCorrect });

        document.querySelectorAll(".answer").forEach((answer) => {          answer.disabled = true;          const originalIndex = Number(answer.dataset.originalIndex);          if (originalIndex === question.correct) answer.classList.add("correct");          else if (originalIndex === selectedIndex) answer.classList.add("wrong");          else answer.classList.add("dimmed");        });

        byId("progressBar").style.width = `${((state.current + 1) / QUESTIONS.length) * 100}%`;        updateMetrics();        setTimeout(() => {          state.current += 1;          if (state.current < QUESTIONS.length) renderQuestion();          else finishGame();        }, 1300);      }

      function finishGame() {        clearInterval(state.timerId);        const percent = Math.round((state.score / QUESTIONS.length) * 100);        byId("finalPercent").textContent = `${percent}%`;        byId("finalText").textContent = `${state.score} / ${QUESTIONS.length} сұрақ`;        byId("questionMetric").textContent = `${QUESTIONS.length}/${QUESTIONS.length}`;        byId("scoreMetric").textContent = state.score;        byId("accuracyMetric").textContent = `${percent}%`;        renderReview();        showScreen("resultScreen");      }

      function renderReview() {        const list = byId("reviewList");        list.innerHTML = "";        state.history.forEach((item, index) => {          const row = document.createElement("div");          row.className = "review-row";          row.innerHTML = `<span><strong>${index + 1}.</strong> ${item.correctAnswer}</span><strong>${item.isCorrect ? "✓" : "×"}</strong>`;          list.appendChild(row);        });      }

      byId("startBtn").addEventListener("click", startGame);      byId("restartBtn").addEventListener("click", returnHome);      updateMetrics();    </script>  </body></html>
